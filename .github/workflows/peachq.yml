# Optional: not a required check.
name: tests (optional)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pq
        uses: peachq-org/setup-peachq@v1.0.0
        with:
          version: 0.92.20261116
          add-to-path: true
          args: -classic
      - run: cargo build --release
      - run: pip install pytest
      - shell: bash
        run: |
          python -m pytest -q tests/ \
            --deselect tests/test_against_q.py::test_q5_parameter_patterns_are_parameter_lists \
            --deselect tests/test_against_q.py::test_reserved_names_are_the_ones_q_reserves \
            -k "not QD002 and not QT017_9 and not QT017_11 and not QT008_2" | tee out.txt
          echo "**peachq ${{ steps.pq.outputs.version }}:** $(tail -1 out.txt)" >> "$GITHUB_STEP_SUMMARY"
